<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORK//INTEL · Un Fantasma en el Sistema</title>
<meta name="description" content="Biblioteca de 162 Google dorks en 17 categorías para reconocimiento OSINT y auditorías autorizadas: constructor de consultas, alcance limitado al dominio objetivo e historial. 100% en el navegador.">
<link rel="icon" href="icono.png">
<script>
  // Tema antes de pintar, para que no parpadee
  (function(){var t=null;try{t=localStorage.getItem('dorkintel-theme');}catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="matrix-canvas" aria-hidden="true"></canvas>

<!-- ── HEADER ── -->
<header class="header">
  <a class="brand" href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">
    <img src="icono.png" alt="Un Fantasma en el Sistema">
    <span class="logo-wrap">
      <span class="logo">DORK<span>//</span>INTEL</span>
      <span class="logo-sub"><span class="status-dot"></span><span data-i18n="subtitle"></span></span>
    </span>
  </a>
  <div class="header-right">
    <div class="header-stats">
      <div class="stat-box"><div class="stat-num" id="total-count">0</div><div class="stat-lbl" data-i18n="statDorks"></div></div>
      <div class="stat-box"><div class="stat-num" id="cat-count">0</div><div class="stat-lbl" data-i18n="statCats"></div></div>
      <div class="stat-box"><div class="stat-num" id="results-count">0</div><div class="stat-lbl" data-i18n="statVisible"></div></div>
      <div class="stat-box"><div class="stat-num" id="history-count">0</div><div class="stat-lbl" data-i18n="statLaunched"></div></div>
    </div>
    <div class="header-tools">
      <a class="site-link" href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">unfantasmaenelsistema.com</a>
      <button id="langToggle" class="hdr-btn" type="button">EN</button>
      <button id="themeToggle" class="hdr-btn" type="button">☀</button>
    </div>
  </div>
</header>

<!-- ── AVISO ── -->
<div class="ethics" id="ethics" role="note">
  <span data-i18n-html="ethics"></span>
  <button class="ethics-close" id="ethicsClose" type="button" data-i18n="understood"></button>
</div>

<!-- ── TICKER ── -->
<div class="ticker-wrap" aria-hidden="true">
  <div class="ticker-label">// INTEL //</div>
  <div class="ticker-inner" id="tickerInner"></div>
</div>

<!-- ── APP ── -->
<div class="app">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-block">
      <div class="sb-title" data-i18n="target"></div>
      <div class="target-wrap">
        <label class="target-label" for="targetInput" data-i18n="targetLabel"></label>
        <input class="target-input" id="targetInput" type="text" placeholder="ejemplo.com" autocomplete="off" spellcheck="false">
        <div class="target-hint" id="targetHint" aria-live="polite"></div>
        <label class="scope-toggle">
          <input type="checkbox" id="scopeToggle" checked>
          <span><span data-i18n="scope"></span><small data-i18n="scopeHelp"></small></span>
        </label>
      </div>
    </div>

    <div class="sidebar-block">
      <div class="sb-title" data-i18n="search"></div>
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input class="search-input" id="searchInput" type="search" autocomplete="off" data-i18n-ph="searchPh">
        </div>
      </div>
    </div>

    <div class="sidebar-block">
      <div class="sb-title" data-i18n="categories"></div>
      <div id="catNav"></div>
    </div>

    <div class="sidebar-block">
      <div class="history-head">
        <div class="sb-title" data-i18n="history"></div>
        <button class="history-clear" id="historyClear" type="button" data-i18n="clearHistory"></button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="mainContent">

    <!-- QUERY BUILDER -->
    <div class="query-builder">
      <label class="qb-label" for="queryEditor" data-i18n="builder"></label>
      <div class="qb-display">
        <textarea class="qb-editor" id="queryEditor" rows="2" spellcheck="false" data-i18n-ph="editorPh"></textarea>
        <div class="qb-actions">
          <button class="btn btn-launch" id="launchBtn" type="button" data-i18n="launch"></button>
          <button class="btn btn-copy" id="copyBtn" type="button" data-i18n="copy"></button>
          <button class="btn btn-clear" id="clearBtn" type="button" data-i18n="clear"></button>
        </div>
      </div>
      <div class="qb-preview" id="queryPreview" aria-live="polite"></div>
      <div class="qb-help" data-i18n-html="help"></div>
    </div>

    <!-- DORK SECTIONS injected by JS -->
    <div id="dorksContainer"></div>

  </main>
</div>

<footer class="footer">
  <span>DORK//INTEL · <a href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener">Un Fantasma en el Sistema</a></span>
  <span><a href="https://github.com/unfantasmaenelsistema/DorkIntel" target="_blank" rel="noopener" data-i18n="source"></a> · MIT</span>
</footer>

<script src="dorks.js"></script>
<script src="app.js"></script>
</body>
</html>
