<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORK//INTEL — Google Hacking Database</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #020508;
  --bg2:      #050d12;
  --surface:  #071218;
  --card:     #0a1a22;
  --border:   #0f2d3d;
  --border2:  #1a4a60;
  --green:    #00ff41;
  --green2:   #00cc33;
  --cyan:     #00d4ff;
  --cyan2:    #0099bb;
  --amber:    #ffb300;
  --red:      #ff3333;
  --purple:   #9d4edd;
  --pink:     #ff006e;
  --text:     #b0cdd8;
  --muted:    #2a4a5a;
  --muted2:   #4a7a8a;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: crosshair;
}

/* ── MATRIX RAIN BG ── */
#matrix-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0.04;
  pointer-events: none;
  z-index: 0;
}

/* ── SCANLINES ── */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
  pointer-events: none;
  z-index: 9998;
}

/* ── VIGNETTE ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
.header {
  position: relative;
  z-index: 10;
  padding: 32px 40px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(0,255,65,0.03) 0%, transparent 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.logo-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.logo {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--green);
  text-shadow: 0 0 30px rgba(0,255,65,0.5), 0 0 60px rgba(0,255,65,0.2);
  line-height: 1;
}

.logo span { color: var(--cyan); }

.logo-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--muted2);
  letter-spacing: 4px;
  text-transform: uppercase;
}

.header-stats {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.stat-box {
  text-align: center;
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 4px;
  background: var(--surface);
  position: relative;
  overflow: hidden;
}
.stat-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: var(--green);
  opacity: 0.5;
}
.stat-num {
  font-family: 'Orbitron', monospace;
  font-size: 20px;
  color: var(--green);
  font-weight: 700;
}
.stat-lbl {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--muted2);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── TICKER ── */
.ticker-wrap {
  width: 100%;
  background: rgba(0,255,65,0.05);
  border-top: 1px solid rgba(0,255,65,0.1);
  border-bottom: 1px solid rgba(0,255,65,0.1);
  overflow: hidden;
  height: 28px;
  display: flex;
  align-items: center;
  position: relative;
  z-index: 10;
}
.ticker-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--green);
  background: rgba(0,255,65,0.1);
  border-right: 1px solid rgba(0,255,65,0.2);
  padding: 0 12px;
  white-space: nowrap;
  letter-spacing: 2px;
  height: 100%;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.ticker-inner {
  display: flex;
  animation: ticker 40s linear infinite;
  white-space: nowrap;
}
@keyframes ticker {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.ticker-item {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  padding: 0 24px;
  letter-spacing: 1px;
}
.ticker-item span { color: var(--cyan); }

/* ── LAYOUT ── */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 130px);
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: calc(100vh - 130px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.sidebar-block {
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}

.sb-title {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--green);
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 4px 16px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sb-title::before {
  content: '▶';
  font-size: 7px;
}

/* Search */
.search-wrap { padding: 8px 12px; }
.search-box {
  position: relative;
  display: flex;
  align-items: center;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px 8px 32px;
  border-radius: 3px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input::placeholder { color: var(--muted2); }
.search-input:focus {
  border-color: var(--green);
  box-shadow: 0 0 12px rgba(0,255,65,0.1);
}
.search-icon {
  position: absolute;
  left: 10px;
  color: var(--muted2);
  font-size: 13px;
}

/* Target input */
.target-wrap { padding: 4px 12px 8px; }
.target-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--muted2);
  letter-spacing: 2px;
  margin-bottom: 5px;
  display: block;
}
.target-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--cyan);
  padding: 8px 10px;
  border-radius: 3px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.target-input::placeholder { color: var(--muted); }
.target-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 12px rgba(0,212,255,0.1);
}

/* Category nav */
.cat-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 2px solid transparent;
  font-size: 13px;
  color: var(--muted2);
  font-family: 'Exo 2', sans-serif;
}
.cat-nav-item:hover {
  color: var(--text);
  background: rgba(0,255,65,0.03);
  border-left-color: var(--border2);
}
.cat-nav-item.active {
  color: var(--green);
  background: rgba(0,255,65,0.06);
  border-left-color: var(--green);
}
.cat-icon { font-size: 15px; width: 18px; flex-shrink: 0; }
.cat-count {
  margin-left: auto;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  background: var(--border);
  color: var(--muted2);
  padding: 1px 6px;
  border-radius: 2px;
}

/* History */
.history-list {
  padding: 4px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 180px;
  overflow-y: auto;
}
.history-item {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  padding: 4px 8px;
  border-radius: 2px;
  border: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s;
}
.history-item:hover { color: var(--cyan); border-color: var(--cyan2); }

/* ── MAIN ── */
.main {
  padding: 20px 24px 60px;
  overflow-y: auto;
}

/* ── QUERY BUILDER ── */
.query-builder {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.query-builder::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--green), var(--cyan), var(--green));
  background-size: 200% 100%;
  animation: slide-gradient 3s linear infinite;
}
@keyframes slide-gradient {
  0% { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}

.qb-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--green);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.qb-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.qb-display {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.qb-text {
  flex: 1;
  min-width: 200px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  color: var(--green);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px 14px;
  word-break: break-all;
  min-height: 42px;
  line-height: 1.5;
}
.qb-text .op { color: var(--cyan); }
.qb-text .val { color: var(--amber); }
.qb-text .site { color: var(--pink); }
.qb-text .cursor {
  display: inline-block;
  width: 8px; height: 14px;
  background: var(--green);
  animation: blink-cursor 1s infinite;
  vertical-align: middle;
  margin-left: 2px;
}
@keyframes blink-cursor { 0%,100%{opacity:1} 50%{opacity:0} }

.qb-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 9px 16px;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.15s;
  text-transform: uppercase;
  white-space: nowrap;
}
.btn-launch {
  background: rgba(0,255,65,0.1);
  border-color: var(--green);
  color: var(--green);
}
.btn-launch:hover {
  background: var(--green);
  color: #000;
  box-shadow: 0 0 20px rgba(0,255,65,0.3);
}
.btn-copy {
  background: rgba(0,212,255,0.08);
  border-color: var(--cyan2);
  color: var(--cyan);
}
.btn-copy:hover { background: rgba(0,212,255,0.15); border-color: var(--cyan); }
.btn-clear {
  background: rgba(255,51,51,0.08);
  border-color: rgba(255,51,51,0.3);
  color: var(--red);
}
.btn-clear:hover { background: rgba(255,51,51,0.15); border-color: var(--red); }

/* ── DORK SECTION ── */
.dork-section {
  margin-bottom: 28px;
  animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:none; }
}

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.section-line { flex: 1; height: 1px; background: var(--border); }
.section-title {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-icon { font-size: 16px; }

/* ── DORK GRID ── */
.dork-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
}

/* ── DORK CARD ── */
.dork-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.dork-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  transition: background 0.15s;
}
.dork-card:hover {
  border-color: var(--border2);
  background: #0d2030;
  transform: translateX(2px);
}

/* Color coding per category */
.dork-card[data-cat="archivos"]::before      { background: var(--cyan); }
.dork-card[data-cat="vulnerabilidades"]::before { background: var(--red); }
.dork-card[data-cat="credenciales"]::before  { background: var(--amber); }
.dork-card[data-cat="personas"]::before      { background: var(--purple); }
.dork-card[data-cat="redes"]::before         { background: var(--green); }
.dork-card[data-cat="empresas"]::before      { background: var(--cyan2); }
.dork-card[data-cat="camaras"]::before       { background: var(--pink); }
.dork-card[data-cat="subdominios"]::before   { background: #ff8c00; }
.dork-card[data-cat="documentos"]::before    { background: #88cc00; }
.dork-card[data-cat="bases-datos"]::before   { background: #cc44ff; }
.dork-card[data-cat="email"]::before         { background: var(--cyan); }
.dork-card[data-cat="wordpress"]::before     { background: #21759b; }
.dork-card[data-cat="login"]::before         { background: var(--amber); }
.dork-card[data-cat="ftp"]::before           { background: var(--green); }
.dork-card[data-cat="iot"]::before           { background: var(--pink); }
.dork-card[data-cat="social"]::before        { background: var(--purple); }
.dork-card[data-cat="config"]::before        { background: var(--red); }
.dork-card[data-cat="combinado"]::before     { background: #ff6600; }

.dork-card:hover::before { opacity: 1; width: 3px; }

.dork-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

.dork-query {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--green);
  line-height: 1.5;
  word-break: break-all;
  flex: 1;
}
.dork-query .op  { color: var(--cyan); }
.dork-query .val { color: var(--amber); }

.dork-tags { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 2px;
  border: 1px solid;
  letter-spacing: 1px;
  white-space: nowrap;
}
.tag-danger { color: var(--red);    border-color: rgba(255,51,51,0.3);    background: rgba(255,51,51,0.08); }
.tag-warn   { color: var(--amber);  border-color: rgba(255,179,0,0.3);   background: rgba(255,179,0,0.08); }
.tag-info   { color: var(--cyan);   border-color: rgba(0,212,255,0.3);   background: rgba(0,212,255,0.08); }
.tag-ok     { color: var(--green);  border-color: rgba(0,255,65,0.3);    background: rgba(0,255,65,0.08); }
.tag-purple { color: var(--purple); border-color: rgba(157,78,221,0.3);  background: rgba(157,78,221,0.08); }

.dork-desc {
  font-size: 11px;
  color: var(--muted2);
  line-height: 1.5;
  font-family: 'Exo 2', sans-serif;
}

.dork-actions {
  display: flex;
  gap: 6px;
  margin-top: 2px;
  opacity: 0;
  transition: opacity 0.15s;
}
.dork-card:hover .dork-actions { opacity: 1; }

.dork-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.15s;
  letter-spacing: 1px;
}
.dork-btn-use {
  background: rgba(0,255,65,0.08);
  border-color: rgba(0,255,65,0.3);
  color: var(--green);
}
.dork-btn-use:hover { background: rgba(0,255,65,0.18); border-color: var(--green); }
.dork-btn-launch {
  background: rgba(0,212,255,0.08);
  border-color: rgba(0,212,255,0.3);
  color: var(--cyan);
}
.dork-btn-launch:hover { background: rgba(0,212,255,0.18); border-color: var(--cyan); }
.dork-btn-copy {
  background: transparent;
  border-color: var(--border);
  color: var(--muted2);
}
.dork-btn-copy:hover { border-color: var(--amber); color: var(--amber); }

/* ── NO RESULTS ── */
.no-results {
  text-align: center;
  padding: 60px 20px;
  font-family: 'Share Tech Mono', monospace;
  color: var(--muted2);
  font-size: 13px;
  letter-spacing: 2px;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--card);
  border: 1px solid var(--green);
  color: var(--green);
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  padding: 10px 18px;
  border-radius: 3px;
  z-index: 9999;
  box-shadow: 0 0 20px rgba(0,255,65,0.2);
  animation: toast-in 0.3s ease, toast-out 0.3s ease 1.7s forwards;
  letter-spacing: 1px;
}
@keyframes toast-in  { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
@keyframes toast-out { from{opacity:1;transform:none} to{opacity:0;transform:translateY(10px)} }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
}
@media (max-width: 600px) {
  .header { padding: 20px; }
  .dork-grid { grid-template-columns: 1fr; }
}

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* blinking status */
.status-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: blink-dot 2s infinite;
  margin-right: 6px;
}
@keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:0.2} }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<!-- ── HEADER ── -->
<header class="header">
  <div class="logo-wrap">
    <div class="logo">DORK<span>//</span>INTEL</div>
    <div class="logo-sub"><span class="status-dot"></span>Google Hacking Intelligence Platform · OSINT Toolkit</div>
  </div>
  <div class="header-stats">
    <div class="stat-box"><div class="stat-num" id="total-count">0</div><div class="stat-lbl">Dorks</div></div>
    <div class="stat-box"><div class="stat-num">18</div><div class="stat-lbl">Categorías</div></div>
    <div class="stat-box"><div class="stat-num" id="results-count">0</div><div class="stat-lbl">Visibles</div></div>
    <div class="stat-box"><div class="stat-num" id="history-count">0</div><div class="stat-lbl">Lanzados</div></div>
  </div>
</header>

<!-- ── TICKER ── -->
<div class="ticker-wrap">
  <div class="ticker-label">// INTEL //</div>
  <div class="ticker-inner" id="tickerInner"></div>
</div>

<!-- ── APP ── -->
<div class="app">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-block">
      <div class="sb-title">Objetivo</div>
      <div class="target-wrap">
        <span class="target-label">TARGET DOMAIN</span>
        <input class="target-input" id="targetInput" type="text" placeholder="ejemplo.com" oninput="updateTarget()">
      </div>
    </div>

    <div class="sidebar-block">
      <div class="sb-title">Buscar</div>
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input class="search-input" id="searchInput" type="text" placeholder="filtrar dorks..." oninput="filterDorks()">
        </div>
      </div>
    </div>

    <div class="sidebar-block">
      <div class="sb-title">Categorías</div>
      <div id="catNav"></div>
    </div>

    <div class="sidebar-block">
      <div class="sb-title">Historial</div>
      <div class="history-list" id="historyList">
        <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);padding:4px 8px">Sin lanzamientos aún</div>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="mainContent">

// ════════════════════════════════════════════════
//  CATEGORY NAV
// ════════════════════════════════════════════════
function buildCatNav() {
  const nav = document.getElementById('catNav');
  CATEGORIES.forEach(cat => {
    const count = cat.id === 'all' ? DORKS.length : DORKS.filter(d => d.cat === cat.id).length;
    const el = document.createElement('div');
    el.className = 'cat-nav-item' + (cat.id === 'all' ? ' active' : '');
    el.innerHTML = `<span class="cat-icon">${cat.icon}</span>${cat.label}<span class="cat-count">${count}</span>`;
    el.onclick = () => { currentCat = cat.id; document.querySelectorAll('.cat-nav-item').forEach(e=>e.classList.remove('active')); el.classList.add('active'); renderDorks(); };
    nav.appendChild(el);
  });
}

// ════════════════════════════════════════════════
//  RENDER DORKS
// ════════════════════════════════════════════════
function renderDorks() {
  const container = document.getElementById('dorksContainer');
  container.innerHTML = '';

  let filtered = DORKS.filter(d => {
    const catOk = currentCat === 'all' || d.cat === currentCat;
    const q = currentSearch.toLowerCase();
    const searchOk = !q || d.title.toLowerCase().includes(q) || d.query.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.tags.some(t=>t.includes(q));
    return catOk && searchOk;
  });

  document.getElementById('results-count').textContent = filtered;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">// SIN RESULTADOS // <br><br>Modifica el filtro o cambia de categoría</div>';
    document.getElementById('results-count').textContent = 0;
    return;
  }

  document.getElementById('results-count').textContent = filtered.length;

  // Group by category if showing all
  let groups = {};
  if (currentCat === 'all') {
    filtered.forEach(d => { if (!groups[d.cat]) groups[d.cat] = []; groups[d.cat].push(d); });
  } else {
    groups[currentCat] = filtered;
  }

  const catInfo = {};
  CATEGORIES.forEach(c => { catInfo[c.id] = c; });

  Object.entries(groups).forEach(([catId, dorks], idx) => {
    const cat = catInfo[catId] || { icon:'◈', label:catId, color:'var(--green)' };
    const section = document.createElement('div');
    section.className = 'dork-section';
    section.style.animationDelay = (idx * 0.04) + 's';

    section.innerHTML = `
      <div class="section-header">
        <div class="section-line"></div>
        <div class="section-title" style="color:${cat.color}">
          <span class="section-icon">${cat.icon}</span>${cat.label.toUpperCase()} <span style="color:var(--muted2);font-size:10px;font-family:'Share Tech Mono',monospace">[${dorks.length}]</span>
        </div>
        <div class="section-line"></div>
      </div>
      <div class="dork-grid" id="grid-${catId}"></div>
    `;

    container.appendChild(section);

    const grid = section.querySelector(`#grid-${catId}`);
    dorks.forEach(dork => {
      const card = buildDorkCard(dork);
      grid.appendChild(card);
    });
  });
}

function colorizeQuery(query) {
  return query
    .replace(/(site:|intitle:|inurl:|intext:|filetype:|ext:|cache:|related:|info:|OR|AND|NOT)/g, '<span class="op">$1</span>')
    .replace(/"([^"]*)"/g, '"<span class="val">$1</span>"')
    .replace(/\{TARGET\}/g, '<span class="site">{TARGET}</span>');
}

function resolveQuery(query) {
  const t = target || '{TARGET}';
  return query.replace(/\{TARGET\}/g, t);
}

function buildDorkCard(dork) {
  const card = document.createElement('div');
  card.className = 'dork-card';
  card.dataset.cat = dork.cat;
  card.dataset.id = dork.id;

  const tags = dork.tags.map(t => {
    const cfg = TAG_CONFIG[t] || TAG_CONFIG['default'];
    return `<span class="tag ${cfg.cls}">${cfg.lbl}</span>`;
  }).join('');

  card.innerHTML = `
    <div class="dork-header">
      <div class="dork-query">${colorizeQuery(dork.query)}</div>
      <div class="dork-tags">${tags}</div>
    </div>
    <div class="dork-desc">${dork.title} — ${dork.desc}</div>
    <div class="dork-actions">
      <button class="dork-btn dork-btn-use"    onclick="useDork('${dork.id}')">+ USAR</button>
      <button class="dork-btn dork-btn-launch" onclick="launchDork('${dork.id}')">▶ LANZAR</button>
      <button class="dork-btn dork-btn-copy"   onclick="copyDork('${dork.id}')">⎘ COPIAR</button>
    </div>
  `;

  return card;
}

// ════════════════════════════════════════════════
//  QUERY BUILDER
// ════════════════════════════════════════════════
function updateQueryDisplay(q) {
  currentQuery = q;
  const el = document.getElementById('queryDisplay');
  if (!q) { el.innerHTML = '<span class="cursor"></span>'; return; }
  el.innerHTML = colorizeQuery(resolveQuery(q)) + '<span class="cursor"></span>';
}

function useDork(id) {
  const dork = DORKS.find(d => d.id === id);
  if (!dork) return;
  updateQueryDisplay(dork.query);
}

function launchDork(id) {
  const dork = DORKS.find(d => d.id === id);
  if (!dork) return;
  const q = resolveQuery(dork.query);
  launchGoogle(q);
}

function launchQuery() {
  if (!currentQuery) { showToast('⚠ Selecciona o escribe un dork primero'); return; }
  launchGoogle(resolveQuery(currentQuery));
}

function launchGoogle(q) {
  const url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
  window.open(url, '_blank');
  addHistory(q);
  document.getElementById('history-count').textContent = searchHistory.length;
}

function copyQuery() {
  if (!currentQuery) { showToast('⚠ No hay consulta activa'); return; }
  navigator.clipboard.writeText(resolveQuery(currentQuery)).then(() => showToast('✓ Consulta copiada'));
}

function copyDork(id) {
  const dork = DORKS.find(d => d.id === id);
  if (!dork) return;
  navigator.clipboard.writeText(resolveQuery(dork.query)).then(() => showToast('✓ Dork copiado'));
}

function clearQuery() {
  currentQuery = '';
  updateQueryDisplay('');
}

// ════════════════════════════════════════════════
//  HISTORY
// ════════════════════════════════════════════════
function addHistory(q) {
  searchHistory.unshift(q);
  if (searchHistory.length > 20) searchHistory.pop();
  const list = document.getElementById('historyList');
  list.innerHTML = searchHistory.map(h => `
    <div class="history-item" onclick="useFreeQuery('${encodeURIComponent(h)}')" title="${h}">${h}</div>
  `).join('');
}

function useFreeQuery(encoded) {
  const q = decodeURIComponent(encoded);
  updateQueryDisplay(q);
}

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2100);
}

  const items = [
    'site:', 'intitle:', 'inurl:', 'intext:', 'filetype:', 'ext:', 'cache:', 'related:', 'info:', 'OR', 'AND', 'NOT',
    '"index of"', '"password"', '"admin"', 'wp-login.php', '.env', '.git', 'phpMyAdmin', 'Elasticsearch',
    '"SQL syntax"', 'id_rsa', '.pem', 'docker-compose', 'api_key', 'AKIA', 'xmlrpc', 'wp-config', 'robots.txt',
  ];
  const ticker = document.getElementById('tickerInner');
  let html = '';
  for (let i = 0; i < 3; i++) {
    items.forEach(item => {
      html += `<span class="ticker-item"><span>${item}</span></span>`;
    });
  }
  ticker.innerHTML = html;
}

//  MATRIX CANVAS
// ════════════════════════════════════════════════
function startMatrix() {
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; drops = Array(Math.floor(canvas.width / 14)).fill(1); });

  const chars = 'アイウエオカキクケコサシスセソタチツテト01010101site:inurl:intext:filetype:'.split('');
  const cols = Math.floor(canvas.width / 14);
  let drops = Array(cols).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(2,5,8,0.04)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = '12px monospace';
    drops.forEach((y, i) => {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(char, i * 14, y * 14);
      if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }
  setInterval(draw, 50);
}

// ════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════
init();
</script>
